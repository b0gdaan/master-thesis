<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <!-- Background: dark circle -->
    <radialGradient id="bgCircle" cx="35%" cy="30%" r="80%">
      <stop offset="0%" style="stop-color:#0d2060;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#050d20;stop-opacity:1"/>
    </radialGradient>

    <!-- Teal glow for outer ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#1a6cf8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:1"/>
    </linearGradient>

    <!-- Clip to circle -->
    <clipPath id="circleClip">
      <circle cx="250" cy="250" r="245"/>
    </clipPath>
  </defs>

  <!-- Outer glow ring -->
  <circle cx="250" cy="250" r="248" fill="none" stroke="url(#ringGrad)" stroke-width="4" opacity="0.9"/>

  <!-- Main background circle -->
  <circle cx="250" cy="250" r="244" fill="url(#bgCircle)"/>

  <!-- Subtle grid inside circle -->
  <g clip-path="url(#circleClip)" stroke="#1e3a6e" stroke-width="0.6" opacity="0.35">
    <line x1="0" y1="125" x2="500" y2="125"/>
    <line x1="0" y1="250" x2="500" y2="250"/>
    <line x1="0" y1="375" x2="500" y2="375"/>
    <line x1="125" y1="0" x2="125" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="375" y1="0" x2="375" y2="500"/>
  </g>

  <!-- Inner accent ring -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="#1a6cf8" stroke-width="1" opacity="0.2"/>

  <!-- Node dots (neural net style, subtle) -->
  <g clip-path="url(#circleClip)" opacity="0.3">
    <circle cx="100" cy="150" r="4" fill="#00d4aa"/>
    <circle cx="160" cy="100" r="3" fill="#1a6cf8"/>
    <circle cx="400" cy="140" r="4" fill="#00d4aa"/>
    <circle cx="350" cy="90"  r="3" fill="#1a6cf8"/>
    <circle cx="420" cy="370" r="4" fill="#1a6cf8"/>
    <circle cx="100" cy="380" r="3" fill="#00d4aa"/>
    <circle cx="140" cy="430" r="3" fill="#1a6cf8"/>
    <circle cx="380" cy="420" r="3" fill="#00d4aa"/>

    <line x1="100" y1="150" x2="160" y2="100" stroke="#00d4aa" stroke-width="0.8"/>
    <line x1="400" y1="140" x2="350" y2="90"  stroke="#00d4aa" stroke-width="0.8"/>
    <line x1="100" y1="380" x2="140" y2="430" stroke="#1a6cf8" stroke-width="0.8"/>
    <line x1="380" y1="420" x2="420" y2="370" stroke="#1a6cf8" stroke-width="0.8"/>
  </g>

  <!-- Initials "BB" or just "B" — going with stylized B -->
  <!-- Main letter B — large, centered, bold -->
  <text x="250" y="295"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="180"
        font-weight="800"
        text-anchor="middle"
        fill="white"
        opacity="0.95"
        letter-spacing="-5">B</text>

  <!-- Teal accent underline under the B -->
  <rect x="155" y="314" width="190" height="4" rx="2" fill="url(#ringGrad)" opacity="0.85"/>

  <!-- Small label below -->
  <text x="250" y="360"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="20"
        font-weight="400"
        text-anchor="middle"
        letter-spacing="6"
        fill="#8aafd4"
        opacity="0.75">DATA · AI · ML</text>

  <!-- Corner accent dots -->
  <circle cx="250" cy="100" r="4" fill="#00d4aa" opacity="0.6"/>
  <circle cx="250" cy="96"  r="2" fill="white"   opacity="0.5"/>
</svg>
